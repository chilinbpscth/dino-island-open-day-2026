<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><style>body{margin:0;background:#f6f3ec;color:#223d30;font:18px/1.6 system-ui,sans-serif}main{max-width:600px;margin:auto;padding:22px}h1{font-size:28px}img{width:100%;border-radius:10px}button{font:700 20px system-ui;background:#146b4d;color:white;border:0;padding:18px;width:100%;border-radius:16px;margin:18px 0}p{margin:12px 0}</style></head><body><main><h1>你嘅恐龍島照顧證書</h1><p id="status" role="status">正在準備證書…</p><img id="photo" alt="個人照顧證書" hidden><button id="save" hidden>儲存證書到手機</button><p id="expiry"></p><p>亦可以長按證書圖片儲存。請妥善保存下載連結。</p></main><script>
const token=<?!= token ?>;let imageUrl='',expiry=0;const status=document.getElementById('status');
function expire(){imageUrl='';document.getElementById('photo').removeAttribute('src');document.getElementById('photo').hidden=true;document.getElementById('save').hidden=true;status.textContent='證書已到期，停止提供下載。';}
google.script.run.withSuccessHandler(result=>{imageUrl=result.image;expiry=result.expiresAt;if(Date.now()>=expiry){expire();return;}let img=document.getElementById('photo');img.src=imageUrl;img.hidden=false;document.getElementById('save').hidden=false;status.textContent='多謝你用心照顧小龍！';document.getElementById('expiry').textContent='有效至 '+new Date(expiry).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'});}).withFailureHandler(e=>status.textContent=e.message||'未能下載，請稍後再試。').dispatch('getCertificate',{token});
setInterval(()=>{if(expiry&&Date.now()>=expiry)expire();},1000);
document.getElementById('save').onclick=async()=>{if(!imageUrl||Date.now()>=expiry){expire();return;}const bytes=Uint8Array.from(atob(imageUrl.split(',')[1]),c=>c.charCodeAt(0));const file=new File([bytes],'恐龍島照顧證書.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'恐龍島照顧證書'});return;}}catch(e){if(e.name==='AbortError')return;}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);};
</script></body></html>
