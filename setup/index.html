<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老師設備設定｜智取恐龍島</title><link rel="stylesheet" href="../shared/style.css"></head><body><main class="setup"><p class="eyebrow">老師使用 · 開場前設定</p><h1>設備準備</h1><p>同一個活動網址用於全部 iPad。裝置憑證只儲存在呢部機，唔會上探險榜。電視只填連線網址。</p><form><label for="url">Apps Script 正式部署網址</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required><label for="token">iPad 裝置憑證（電視留空）</label><input id="token" type="password" autocomplete="off"><div class="actions"><button class="primary">儲存設定</button><button id="test" type="button">測試榜連線</button><button id="prepare" type="button">準備離線遊戲</button></div></form><p id="status" class="notice" role="status"></p><div class="actions"><a href="../hub/">開啟 iPad 遊戲</a><a href="../board/">開啟電視榜</a></div></main><script type="module">
import{read,write}from'../shared/storage.js';import{bridge}from'../shared/network.js';import{CONFIG}from'../shared/config.js';let s=read('settings',{});const url=document.querySelector('#url'),token=document.querySelector('#token'),status=document.querySelector('#status');url.value=s.appScriptUrl||CONFIG.appScriptUrl||'';token.value=s.deviceToken||'';document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url.value.trim())){status.textContent='請填正式 /exec 部署網址。';return;}write('settings',{appScriptUrl:url.value.trim(),deviceToken:token.value.trim()});bridge.destroy();status.textContent='設定已儲存在呢部設備。';};document.querySelector('#test').onclick=async()=>{status.textContent='測試連線中…';try{let r=await bridge.call('getBoard');status.textContent='已收到榜資料，共 '+(r.players.length+r.others)+' 位。';}catch(e){status.textContent=e.message;}};document.querySelector('#prepare').onclick=async()=>{status.textContent='正在下載全套遊戲，請保持連線…';try{await navigator.serviceWorker.register('../sw.js');await navigator.serviceWorker.ready;write('offlineReady',true);status.textContent='離線遊戲準備完成。請拔 Wi-Fi，實試重新開啟遊戲。';}catch{status.textContent='未完成離線下載，請檢查連線。';}};
</script></body></html>
