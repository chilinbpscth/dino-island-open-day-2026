<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老師設備設定｜智取恐龍島</title><link rel="stylesheet" href="../shared/style.css"></head><body><main class="setup"><p class="eyebrow">老師使用 · 開場前設定</p><h1>設備準備</h1><p>同一個活動網址用於全部 iPad。裝置憑證只儲存在呢部機，唔會上探險榜。電視只填連線網址。</p><form><label for="url">Apps Script 正式部署網址</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required><label for="token">iPad 裝置憑證（電視留空）</label><input id="token" type="password" autocomplete="off"><div class="actions"><button class="primary">儲存設定</button><button id="test" type="button">測試榜連線</button><button id="prepare" type="button">準備離線遊戲</button></div></form><p id="status" class="notice" role="status"></p><div class="actions"><a href="../hub/">開啟 iPad 遊戲</a><a href="../board/">開啟電視榜</a><a href="./audio-review.html">核對 45 段遊戲語音</a></div></main><script type="module" src="./enroll.js"></script><script type="module">
import{read,write}from'../shared/storage.js';import{inspectOfflineCache}from'../shared/offline.js';import{bridge}from'../shared/network.js';import{CONFIG}from'../shared/config.js';if(document.querySelector('form')){let s=read('settings',{});const url=document.querySelector('#url'),token=document.querySelector('#token'),status=document.querySelector('#status');url.value=s.appScriptUrl||CONFIG.appScriptUrl||'';token.value=s.deviceToken||'';document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url.value.trim())){status.textContent='請填正式 /exec 部署網址。';return;}write('settings',{appScriptUrl:url.value.trim(),deviceToken:token.value.trim()});bridge.destroy();status.textContent='設定已儲存在呢部設備。';};document.querySelector('#test').onclick=async()=>{status.textContent='測試連線中…';try{let r=await bridge.call('getBoard');status.textContent='已收到榜資料，共 '+(r.players.length+r.others)+' 位。';}catch(e){status.textContent=e.message;}};document.querySelector('#prepare').onclick=async()=>{
 const button=document.querySelector('#prepare');button.disabled=true;write('offlineReady',false);status.textContent='正在下載全套遊戲，請保持連線…';let timer;
 try{
  await navigator.serviceWorker.register('../sw.js');
  const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('下載逾時')),30000);})]);
  const result=await inspectOfflineCache(navigator.serviceWorker.controller||reg.active);
  write('offlineReady',result.complete);
  status.textContent=result.complete?'本機遊戲版本已可離線使用。請拔 Wi-Fi，實試重新開啟遊戲。':`離線素材未齊（欠 ${result.missing} 項），請保持連線，重新開啟遊戲再檢查。`;
 }catch{status.textContent='離線準備未能確認，請保持連線再試。';}
 finally{clearTimeout(timer);button.disabled=false;}
};
}</script></body></html>
